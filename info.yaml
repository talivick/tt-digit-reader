# Tiny Tapeout project information
project:
  title:        "Digit reader"      # Project title
  author:       "Thomas Livick"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An INT8 2x2 systolic matrix unit with a digit reader that drives a touch LCD, teach mode as the stretch"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_talivick_digit_reader"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "mac.sv"
    - "pe.sv"
    - "array.sv"
    - "requant.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "host byte bit 0"
  ui[1]: "host byte bit 1"
  ui[2]: "host byte bit 2"
  ui[3]: "host byte bit 3"
  ui[4]: "host byte bit 4"
  ui[5]: "host byte bit 5"
  ui[6]: "host byte bit 6"
  ui[7]: "host byte bit 7"

  # Outputs
  uo[0]: "seg a"
  uo[1]: "seg b"
  uo[2]: "seg c"
  uo[3]: "seg d"
  uo[4]: "seg e"
  uo[5]: "seg f"
  uo[6]: "seg g"
  uo[7]: "seg dp"

  # Bidirectional pins
  uio[0]: "sck"
  uio[1]: "mosi"
  uio[2]: "dc"
  uio[3]: "cs_lcd_n"
  uio[4]: "cs_tp_n"
  uio[5]: "miso"
  uio[6]: "in_ready"
  uio[7]: "in_valid"

# Do not change!
yaml_version: 6
